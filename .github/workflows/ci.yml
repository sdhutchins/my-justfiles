name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test justfile templates
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Test justfiles
        run: bash tests/test-justfiles.sh

  lint:
    name: Lint and documentation checks
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super-Linter
        uses: github/super-linter@ce838ab356d25fc8e83a16fa6d1fc6f583e14e87 # Super-Linter v8.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_MARKDOWN: true
          VALIDATE_BASH: true
          LINTER_RULES_PATH: .
          MARKDOWN_CONFIG_FILE: .markdownlint.json

      - name: Check Markdown links
        if: ${{ !cancelled() }}
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: ".markdownlint.json"
